name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sre-app:ci .

      - name: Start container
        run: docker run -d -p 8080:8080 --name sre-app sre-app:ci

      - name: Smoke test /health
        run: |
          sleep 5
          curl --fail http://localhost:8080/health

      - name: Show logs if something failed
        if: failure()
        run: docker logs sre-app
